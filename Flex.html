<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Flexbox Items</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			font-family: Arial, sans-serif;
			background: #f1f5f9;
		}

		.container {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 16px;
			width: min(700px, 90%);
			padding: 24px;
			background: white;
			border-radius: 12px;
			box-shadow: 0 4px 16px rgb(0 0 0 / 10%);
		}

		.item {
			display: grid;
			place-items: center;
			width: 100px;
			height: 100px;
			color: white;
			font-size: 2rem;
			font-weight: bold;
			background: #2563eb;
			border-radius: 8px;
		}
	</style>
</head>
<body>
	<main class="container" aria-label="Flexbox items">
		<div class="item">1</div>
		<div class="item">2</div>
		<div class="item">3</div>
		<div class="item">4</div>
		<div class="item">5</div>
		<div class="item">6</div>
	</main>
</body>
</html>
